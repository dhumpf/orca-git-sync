name: Publish to OrcaCloud

# A release published by dhumpf on GitHub gets its files attached and,
# unless it is a pre-release, goes to Orca Cloud as a new plugin version.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.server_url == 'https://github.com' && github.repository == 'dhumpf/orca-git-sync' && github.triggering_actor == 'dhumpf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit GitHub recorded for the event, not the tag as it is now.
          ref: ${{ github.sha }}
          persist-credentials: false
      # Later jobs check out this commit, so a tag moved mid-run changes nothing.
      - id: sha
        run: |
          set -euo pipefail
          sha="$(git rev-parse --verify HEAD)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Recorded commit is not a commit id: '$sha'" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - run: make test
      - run: make version-check
        env:
          TAG: ${{ github.event.release.tag_name }}

  attach:
    needs: check
    if: github.server_url == 'https://github.com' && github.repository == 'dhumpf/orca-git-sync' && github.triggering_actor == 'dhumpf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Build release files
        run: make release
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          gh release upload "$TAG" --clobber -R "$GITHUB_REPOSITORY" \
            dist/orca_git_sync.py "dist/orca-git-sync-${version}.zip" dist/orca_git_sync_any.py

  publish:
    needs: [check, attach]
    if: github.server_url == 'https://github.com' && github.repository == 'dhumpf/orca-git-sync' && github.triggering_actor == 'dhumpf' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Space-separated globs matching the plugin files to upload (.whl / .py).
      PLUGIN_FILES: "dist/orca_git_sync_any.py"
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check.outputs.sha }}
          persist-credentials: false

      - name: Build release files
        run: make release

      # As in the Orca Cloud wiki, "Publish from GitHub". Auth is GitHub OIDC, no secret.
      # Changelog: the release body, else the CHANGELOG.md section, cut at 4000 characters.
      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          changelog="$(jq -r '.release.body // "" | .[0:4000]' "$GITHUB_EVENT_PATH")"
          if [ -z "${changelog//[[:space:]]/}" ]; then
            changelog="$(jq -Rrs '.[0:4000]' dist/release-notes.md)"
          fi
          if [ -z "${changelog//[[:space:]]/}" ]; then
            echo "Empty changelog: no release body and no dist/release-notes.md" >&2
            exit 1
          fi
          oidc_token="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          if [ -z "$oidc_token" ] || [ "$oidc_token" = "null" ]; then
            echo "No OIDC token from GitHub, is id-token: write set on this job?" >&2
            exit 1
          fi
          version="${TAG#v}"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version, changelog: $changelog}')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
