name: Publish to OrcaCloud

# A release published by dhumpf on GitHub gets its files attached and
# goes to Orca Cloud as a new plugin version.
on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.server_url == 'https://github.com' && github.repository == 'dhumpf/orca-git-sync' && github.actor == 'dhumpf'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - run: make test
      - run: make version-check TAG="$GITHUB_REF_NAME"

  publish:
    needs: check
    if: github.server_url == 'https://github.com' && github.repository == 'dhumpf/orca-git-sync' && github.actor == 'dhumpf'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      # Space-separated globs matching the plugin files to upload (.whl / .py).
      PLUGIN_FILES: "dist/orca_git_sync_any.py"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Build release files
        run: make release TAG="$GITHUB_REF_NAME"

      - name: Attach files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release upload "$GITHUB_REF_NAME" --clobber -R "$GITHUB_REPOSITORY" \
            dist/orca_git_sync.py "dist/orca-git-sync-${version}.zip" dist/orca_git_sync_any.py

      # As in the Orca Cloud wiki, "Publish from GitHub". Auth is GitHub OIDC, no secret.
      - name: Publish release to OrcaCloud
        run: |
          set -euo pipefail
          oidc_token="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=orcacloud" | jq -r .value)"
          version="${GITHUB_REF_NAME#v}"
          changelog="$(jq -r '.release.body // ""' "$GITHUB_EVENT_PATH" | head -c 4000)"
          metadata="$(jq -cn --arg version "$version" --arg changelog "$changelog" \
            '{version: $version} + (if $changelog == "" then {} else {changelog: $changelog} end)')"
          args=(-F "metadata=$metadata")
          shopt -s nullglob
          for file in $PLUGIN_FILES; do
            args+=(-F "files=@$file")
          done
          if [ "${#args[@]}" -eq 1 ]; then
            echo "No plugin files matched: $PLUGIN_FILES" >&2
            exit 1
          fi
          status="$(curl -sS -o response.json -w '%{http_code}' \
            -H "Authorization: Bearer $oidc_token" \
            "${args[@]}" \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)"
          cat response.json
          echo
          [ "$status" = "201" ]
